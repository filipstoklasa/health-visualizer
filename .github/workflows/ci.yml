name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # `build` runs tsc --noEmit first, so this is the typecheck too.
      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

      # browser-test.mjs skips itself when Chrome is missing; fail loudly here
      # instead, so a runner without Chrome cannot turn the suite green.
      - name: Check Chrome is present
        run: google-chrome --version

      - name: Browser tests
        run: npm run test:browser
